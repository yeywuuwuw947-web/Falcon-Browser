<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Falcon Browser — Home</title>
<style>
  :root{
    --navy-1:#0f1630;
    --navy-2:#1c2650;
    --amber-1:#ffb238;
    --amber-2:#ff7a3d;
    --ink:#161b2c;
    --muted:#7c8299;
    --card:#ffffff;
    --bg-top:#fff7ec;
    --bg-bot:#eef1fb;
    --radius-tile:19px;
    --radius-pill:32px;
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:#dfe3f0;
    display:flex;
    justify-content:center;
    color:var(--ink);
  }
  .phone{
    width:100%;
    max-width:430px;
    min-height:100vh;
    background:linear-gradient(180deg,var(--bg-top) 0%,#f7f4fb 45%,var(--bg-bot) 100%);
    display:flex;
    flex-direction:column;
    position:relative;
    overflow:hidden;
  }

  /* browser chrome (back/fwd/menu/tabs/home) — top */
  .chrome-top{
    display:flex;
    justify-content:space-between;
    padding:18px 26px 6px;
    color:#c3c8da;
  }
  .chrome-top svg{width:19px;height:19px;}

  .logo-wrap{
    display:flex;
    flex-direction:column;
    align-items:center;
    margin:26px 0 24px;
  }
  .logo{
    width:96px;height:96px;
    position:relative;
  }
  .logo svg{width:100%;height:100%;filter:drop-shadow(0 10px 20px rgba(255,122,61,.35));}
  .logo-name{
    margin-top:12px;
    font-weight:800;
    letter-spacing:.4px;
    color:var(--navy-2);
    font-size:16px;
  }
  .logo-tag{
    font-size:10.5px;
    letter-spacing:2.5px;
    text-transform:uppercase;
    color:var(--amber-2);
    font-weight:700;
    margin-top:2px;
  }

  /* search pill */
  .search-wrap{padding:0 22px;}
  .search-pill{
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--card);
    border:1.5px solid #eee1d2;
    border-radius:var(--radius-pill);
    padding:14px 18px;
    box-shadow:0 12px 26px rgba(28,38,80,.10);
  }
  .search-pill input{
    border:none;outline:none;flex:1;
    font-size:15.5px;background:transparent;color:var(--ink);
  }
  .search-pill input::placeholder{color:#b3a99a;}
  .icon-btn{
    background:none;border:none;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    color:var(--navy-2);
    padding:2px;
  }

  /* grid */
  .grid{
    margin-top:28px;
    padding:0 20px 30px;
    display:grid;
    grid-template-columns:repeat(5,1fr);
    row-gap:20px;
    column-gap:6px;
  }
  .tile{
    display:flex;flex-direction:column;align-items:center;gap:7px;
    cursor:pointer;
    position:relative;
    -webkit-tap-highlight-color:transparent;
  }
  .tile .icon{
    width:58px;height:58px;
    border-radius:var(--radius-tile);
    display:flex;align-items:center;justify-content:center;
    font-size:25px;
    box-shadow:0 8px 16px rgba(20,30,60,.14);
    position:relative;
    transition:transform .15s ease;
  }
  .tile:active .icon{transform:scale(.92);}
  .tile .label{
    font-size:11.5px;
    color:#454b60;
    max-width:66px;
    text-align:center;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .remove-x{
    position:absolute;
    top:-6px;right:-2px;
    width:18px;height:18px;
    background:var(--amber-2);
    border-radius:50%;
    color:#fff;
    display:none;
    align-items:center;justify-content:center;
    font-size:12px;
    line-height:1;
    box-shadow:0 2px 6px rgba(0,0,0,.25);
  }
  .edit-mode .remove-x{display:flex;}
  .edit-mode .icon{animation:wiggle .28s infinite;}
  @keyframes wiggle{
    0%{transform:rotate(-1.2deg);}
    50%{transform:rotate(1.2deg);}
    100%{transform:rotate(-1.2deg);}
  }

  .add-tile .icon{
    background:#f3ede3;
    border:2px dashed #d8cdb8;
    color:#a89a80;
    box-shadow:none;
  }

  .spacer{flex:1;}

  .done-btn{
    display:none;
    text-align:center;
    color:var(--amber-2);
    font-weight:700;
    font-size:14px;
    padding:2px 0 10px;
    cursor:pointer;
  }
  .done-btn.show{display:block;}

  /* bottom nav */
  .bottom-nav{
    display:flex;
    justify-content:space-around;
    align-items:center;
    padding:14px 10px calc(14px + env(safe-area-inset-bottom));
    border-top:1px solid #e7e0d3;
    background:rgba(255,255,255,.9);
    backdrop-filter:blur(10px);
    position:sticky;
    bottom:0;
  }
  .bottom-nav button{
    background:none;border:none;color:var(--navy-2);
    display:flex;flex-direction:column;align-items:center;
    gap:2px;cursor:pointer;padding:4px 8px;
  }
  .bottom-nav button svg{width:22px;height:22px;}
  .tab-count{
    width:20px;height:20px;border:1.6px solid var(--navy-2);border-radius:5px;
    font-size:10.5px;display:flex;align-items:center;justify-content:center;
    font-weight:700;
  }

  .toast{
    position:fixed;
    left:50%;bottom:90px;
    transform:translateX(-50%);
    background:var(--navy-1);color:#fff;
    padding:10px 18px;
    border-radius:20px;
    font-size:13px;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
    z-index:50;
    max-width:80%;
    text-align:center;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}
</style>
</head>
<body>
<div class="phone" id="phone">

  <div class="chrome-top">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="5" width="14" height="14" rx="3"/></svg>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 11l8-7 8 7"/><path d="M6 10v9h12v-9"/></svg>
  </div>

  <div class="logo-wrap">
    <div class="logo">
      <svg viewBox="0 0 100 100">
        <defs>
          <linearGradient id="wing" x1="0" y1="1" x2="1" y2="0">
            <stop offset="0%" stop-color="var(--navy-1)"/>
            <stop offset="60%" stop-color="var(--amber-2)"/>
            <stop offset="100%" stop-color="var(--amber-1)"/>
          </linearGradient>
        </defs>
        <path d="M50 6 C 34 20, 8 34, 4 58 C 22 50, 36 46, 48 50 C 40 60, 30 72, 26 92 C 40 80, 50 68, 56 56 C 64 70, 74 82, 90 92 C 82 70, 74 58, 64 50 C 76 48, 86 50, 96 56 C 88 34, 66 20, 50 6 Z" fill="url(#wing)"/>
      </svg>
    </div>
    <div class="logo-name">Falcon Browser</div>
    <div class="logo-tag">Fly through the web</div>
  </div>

  <div class="search-wrap">
    <form class="search-pill" id="searchForm">
      <button type="submit" class="icon-btn" aria-label="Search">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </button>
      <input id="searchInput" type="text" placeholder="Search or type a link" autocomplete="off"/>
      <button type="button" class="icon-btn" id="scanBtn" aria-label="Scan">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 8V5a1 1 0 0 1 1-1h3"/><path d="M20 8V5a1 1 0 0 1-1-1h-3"/>
          <path d="M4 16v3a1 1 0 0 0 1 1h3"/><path d="M20 16v3a1 1 0 0 0-1 1h-3"/>
        </svg>
      </button>
    </form>
  </div>

  <div class="grid" id="grid"></div>

  <div class="done-btn" id="doneBtn">Done ✓</div>
  <div class="spacer"></div>

  <div class="bottom-nav">
    <button id="navBack"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button>
    <button id="navFwd"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></button>
    <button id="navMenu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg></button>
    <button id="navTabs"><span class="tab-count">1</span></button>
    <button id="navHome"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 11l8-7 8 7"/><path d="M6 10v9h12v-9"/></svg></button>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
const emojiSet = ["📺","📱","❤️","🕒","❓","🎮","🌙","❗","🏏","📰","🕹️","🧩","🎯","🎲","⭐","🎧","📷","🛒"];
const colors = ["#ff7a3d","#eef0f6","#ff5c7a","#22b8a6","#ffb238","#1c2650","#ffcf4d","#e05a4e","#ff8fa3","#4d8fff","#8e6ad6","#2fa88e"];

function loadShortcuts(){
  return [
    {name:"Youtube", emoji:"📺", color:"#ff5c3d"},
    {name:"SocialNet", emoji:"📘", color:"#eef0f6"},
    {name:"Bookmark", emoji:"❤️", color:"#ff5c7a"},
    {name:"History", emoji:"🕒", color:"#22b8a6"},
    {name:"Help", emoji:"❓", color:"#ffb238"},
    {name:"Game", emoji:"🎮", color:"#1c2650"},
    {name:"Astro", emoji:"🌙", color:"#151830"},
    {name:"Quiz", emoji:"❗", color:"#ffcf4d"},
    {name:"Cricket", emoji:"🏏", color:"#e05a4e"},
    {name:"Feedzop", emoji:"📰", color:"#ff8fa3"},
    {name:"Game2", emoji:"🕹️", color:"#1c2650"},
    {name:"Quiz2", emoji:"🧩", color:"#ffcf4d"},
    {name:"PuduGame", emoji:"🎮", color:"#4d8fff"},
  ];
}

let shortcuts = loadShortcuts();
let editMode = false;

const grid = document.getElementById('grid');
const toastEl = document.getElementById('toast');
const doneBtn = document.getElementById('doneBtn');

function showToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>toastEl.classList.remove('show'), 1600);
}

function render(){
  grid.innerHTML = "";
  grid.classList.toggle('edit-mode', editMode);
  doneBtn.classList.toggle('show', editMode);

  shortcuts.forEach((s, idx)=>{
    const tile = document.createElement('div');
    tile.className = 'tile';
    tile.innerHTML = `
      <div class="icon" style="background:${s.color}">
        ${s.emoji}
        <span class="remove-x" data-idx="${idx}">✕</span>
      </div>
      <div class="label">${s.name}</div>
    `;
    tile.addEventListener('click', (e)=>{
      if(editMode){
        if(e.target.classList.contains('remove-x')) return;
        return;
      }
      showToast(`Opening ${s.name}…`);
    });
    let pressTimer;
    tile.addEventListener('touchstart', ()=>{ pressTimer = setTimeout(()=>{editMode=true; render();}, 500); });
    tile.addEventListener('touchend', ()=> clearTimeout(pressTimer));
    tile.addEventListener('mousedown', ()=>{ pressTimer = setTimeout(()=>{editMode=true; render();}, 500); });
    tile.addEventListener('mouseup', ()=> clearTimeout(pressTimer));
    grid.appendChild(tile);
  });

  const addTile = document.createElement('div');
  addTile.className = 'tile add-tile';
  addTile.innerHTML = `<div class="icon">+</div><div class="label">Add</div>`;
  addTile.addEventListener('click', addShortcut);
  grid.appendChild(addTile);

  grid.querySelectorAll('.remove-x').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      const i = parseInt(btn.dataset.idx);
      const removed = shortcuts[i].name;
      shortcuts.splice(i,1);
      render();
      showToast(`${removed} removed`);
    });
  });
}

function addShortcut(){
  const name = prompt("Shortcut name:");
  if(!name) return;
  const emoji = emojiSet[Math.floor(Math.random()*emojiSet.length)];
  const color = colors[Math.floor(Math.random()*colors.length)];
  shortcuts.push({name: name.slice(0,14), emoji, color});
  render();
  showToast(`${name} added`);
}

doneBtn.addEventListener('click', ()=>{ editMode=false; render(); });

document.getElementById('searchForm').addEventListener('submit', (e)=>{
  e.preventDefault();
  const q = document.getElementById('searchInput').value.trim();
  if(!q) return;
  const isUrl = /^https?:\/\//.test(q) || (/\./.test(q) && !/\s/.test(q));
  const url = isUrl ? (q.startsWith('http') ? q : 'https://'+q) : ('https://www.google.com/search?q='+encodeURIComponent(q));
  window.open(url, '_blank');
});

document.getElementById('scanBtn').addEventListener('click', ()=> showToast('Scanner would open here'));
['navBack','navFwd','navMenu','navTabs','navHome'].forEach(id=>{
  document.getElementById(id).addEventListener('click', ()=> showToast(id.replace('nav','') + ' tapped'));
});

render();
</script>
</body>
</html>
